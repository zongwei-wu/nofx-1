services:
  # Backend service (API and core logic)
  nofx:
    image: ${NOFX_BACKEND_IMAGE:-nofx-trading:local}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
      target: ${NOFX_BACKEND_BUILD_TARGET:-default}
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:latest}
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.25-alpine}
        TA_LIB_VERSION: ${TA_LIB_VERSION:-0.4.0}
        TA_LIB_BASE_IMAGE: ${TA_LIB_BASE_IMAGE:-local/nofx-ta-lib-base:0.4.0}
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s  # 允许应用有 30 秒时间优雅关闭
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./config.db:/app/config.db
      - ./beta_codes.txt:/app/beta_codes.txt:ro
      - ./decision_logs:/app/decision_logs
      - ./data/copy-trading:/app/data/copy-trading
      - ./prompts:/app/prompts
      - ./secrets:/app/secrets:ro  # RSA密钥文件
      - /etc/localtime:/etc/localtime:ro  # Sync host time
    environment:
      - TZ=${NOFX_TIMEZONE:-Asia/Shanghai}  # Set timezone
      - AI_MAX_TOKENS=4000  # AI响应的最大token数（默认2000，建议4000-8000）
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}  # 数据库加密密钥
      - JWT_SECRET=${JWT_SECRET}  # JWT认证密钥
      - COPY_TRADING_CACHE_DIR=/app/data/copy-trading
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend:
    image: ${NOFX_FRONTEND_IMAGE:-nofx-frontend:local}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge