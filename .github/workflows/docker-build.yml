name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  TA_LIB_VERSION: "0.4.0"

jobs:
  # 预处理: 转换镜像名为小写
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      image_base: ${{ steps.lowercase.outputs.image_base }}
    steps:
      - name: Convert repository name to lowercase
        id: lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_base=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "Lowercase repository: ${REPO_LOWER}"

  # 变更检测: 仅在相关目录变更时构建对应镜像
  detect-changes:
    runs-on: ubuntu-22.04
    outputs:
      build_backend: ${{ steps.detect.outputs.build_backend }}
      build_frontend: ${{ steps.detect.outputs.build_frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend/frontend changes
        id: detect
        run: |
          # 默认都不构建，后续按事件类型和 diff 结果覆盖
          BUILD_BACKEND=false
          BUILD_FRONTEND=false

          EVENT_NAME="${{ github.event_name }}"
          REF_TYPE="${{ github.ref_type }}"

          # 标签发布和手动触发默认构建全部镜像
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            BUILD_BACKEND=true
            BUILD_FRONTEND=true
          else
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"

            # 首次 push 或 before 缺失时，保守起见构建全部
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BUILD_BACKEND=true
              BUILD_FRONTEND=true
            else
              CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")

              # Backend 相关文件
              if echo "$CHANGED_FILES" | grep -E -q '(^docker/Dockerfile\.backend$|^docker/Dockerfile\.ta-lib-base$|^go\.mod$|^go\.sum$|\.go$|^\.github/workflows/docker-build\.yml$)'; then
                BUILD_BACKEND=true
              fi

              # Frontend 相关文件
              if echo "$CHANGED_FILES" | grep -E -q '(^docker/Dockerfile\.frontend$|^web/|^nginx/|^\.github/workflows/docker-build\.yml$)'; then
                BUILD_FRONTEND=true
              fi

              # 兜底: 公共依赖或 compose 变更时全构建
              if echo "$CHANGED_FILES" | grep -E -q '(^docker-compose\.yml$|^\.dockerignore$)'; then
                BUILD_BACKEND=true
                BUILD_FRONTEND=true
              fi
            fi
          fi

          echo "build_backend=${BUILD_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "build_frontend=${BUILD_FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "build_backend=${BUILD_BACKEND}"
          echo "build_frontend=${BUILD_FRONTEND}"

  # TA-Lib 预编译基础镜像（backend fast 构建依赖）
  build-ta-lib-base:
    needs: [prepare, detect-changes]
    if: needs.detect-changes.outputs.build_backend == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_tag: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
          - arch_tag: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TA-Lib base (${{ matrix.arch_tag }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.ta-lib-base
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ needs.prepare.outputs.image_base }}/nofx-ta-lib-base:${{ env.TA_LIB_VERSION }}-${{ matrix.arch_tag }}
          cache-from: type=gha,scope=ta-lib-base-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=ta-lib-base-${{ matrix.arch_tag }}
          build-args: |
            TA_LIB_VERSION=${{ env.TA_LIB_VERSION }}

      - name: TA-Lib base digest
        run: |
          echo "✅ TA-Lib base: ${{ env.TA_LIB_VERSION }}-${{ matrix.arch_tag }}"

  # 并行构建策略: 使用原生架构 runner 提升速度
  # GitHub Actions 现在支持原生 ARM64 runner (ubuntu-22.04-arm)
  build-and-push:
    needs: [prepare, detect-changes, build-ta-lib-base]
    if: |
      always() &&
      (needs.detect-changes.outputs.build_backend == 'true' || needs.detect-changes.outputs.build_frontend == 'true') &&
      (needs.build-ta-lib-base.result == 'success' || needs.build-ta-lib-base.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      # 并行运行所有构建任务
      fail-fast: false
      matrix:
        include:
          # Backend builds
          - name: backend
            dockerfile: ./docker/Dockerfile.backend
            image_suffix: backend
            build_target: fast
            platform: linux/amd64
            arch_tag: amd64
            runner: ubuntu-22.04
          - name: backend
            dockerfile: ./docker/Dockerfile.backend
            image_suffix: backend
            build_target: fast
            platform: linux/arm64
            arch_tag: arm64
            runner: ubuntu-22.04-arm  # 原生 ARM64 runner
          # Frontend builds
          - name: frontend
            dockerfile: ./docker/Dockerfile.frontend
            image_suffix: frontend
            build_target: ""
            platform: linux/amd64
            arch_tag: amd64
            runner: ubuntu-22.04
          - name: frontend
            dockerfile: ./docker/Dockerfile.frontend
            image_suffix: frontend
            build_target: ""
            platform: linux/arm64
            arch_tag: arm64
            runner: ubuntu-22.04-arm  # 原生 ARM64 runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 原生 ARM64 runner 不需要 QEMU 模拟
      # 只在需要时设置 QEMU (理论上不需要,因为是原生构建)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ needs.prepare.outputs.image_base }}/nofx-${{ matrix.image_suffix }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/nofx-{1}', secrets.DOCKERHUB_USERNAME, matrix.image_suffix) || '' }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch_tag }}
            type=semver,pattern={{version}},suffix=-${{ matrix.arch_tag }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.arch_tag }}
            type=sha,prefix={{branch}}-,suffix=-${{ matrix.arch_tag }}

      - name: Build and push ${{ matrix.name }}-${{ matrix.arch_tag }} image
        if: |
          (matrix.name == 'backend' && needs.detect-changes.outputs.build_backend == 'true') ||
          (matrix.name == 'frontend' && needs.detect-changes.outputs.build_frontend == 'true')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.build_target || '' }}
          # 单独构建每个架构,4 个任务并行运行
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用架构特定的缓存
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch_tag }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            TA_LIB_VERSION=${{ env.TA_LIB_VERSION }}
            TA_LIB_BASE_IMAGE=${{ env.REGISTRY_GHCR }}/${{ needs.prepare.outputs.image_base }}/nofx-ta-lib-base:${{ env.TA_LIB_VERSION }}-${{ matrix.arch_tag }}

      - name: Image digest
        if: |
          (matrix.name == 'backend' && needs.detect-changes.outputs.build_backend == 'true') ||
          (matrix.name == 'frontend' && needs.detect-changes.outputs.build_frontend == 'true')
        run: |
          echo "✅ Built: ${{ matrix.name }}-${{ matrix.arch_tag }}"
          echo "Platform: ${{ matrix.platform }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      - name: Skip reason
        if: |
          (matrix.name == 'backend' && needs.detect-changes.outputs.build_backend != 'true') ||
          (matrix.name == 'frontend' && needs.detect-changes.outputs.build_frontend != 'true')
        run: |
          echo "⏭️ Skip build for ${{ matrix.name }}-${{ matrix.arch_tag }} (no relevant changes detected)"

  # 合并多架构镜像为统一 manifest
  create-manifest:
    needs: [prepare, detect-changes, build-and-push]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image_suffix: [backend, frontend]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Create and push multi-arch manifest
        if: |
          (matrix.image_suffix == 'backend' && needs.detect-changes.outputs.build_backend == 'true') ||
          (matrix.image_suffix == 'frontend' && needs.detect-changes.outputs.build_frontend == 'true')
        run: |
          # 提取分支/标签名
          REF_NAME="${{ github.ref_name }}"

          # GHCR manifest (使用小写仓库名)
          REPO_LOWER="${{ needs.prepare.outputs.image_base }}"
          GHCR_IMAGE="${{ env.REGISTRY_GHCR }}/${REPO_LOWER}/nofx-${{ matrix.image_suffix }}"

          echo "📦 Creating manifest for ${{ matrix.image_suffix }}..."
          echo "Repository: ${REPO_LOWER}"
          echo "Image: ${GHCR_IMAGE}"

          # 创建并推送 manifest (合并 amd64 和 arm64)
          docker buildx imagetools create -t "${GHCR_IMAGE}:${REF_NAME}" \
            "${GHCR_IMAGE}:${REF_NAME}-amd64" \
            "${GHCR_IMAGE}:${REF_NAME}-arm64"

          # 如果是主分支,也创建 latest 标签
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            docker buildx imagetools create -t "${GHCR_IMAGE}:latest" \
              "${GHCR_IMAGE}:${REF_NAME}-amd64" \
              "${GHCR_IMAGE}:${REF_NAME}-arm64"
            echo "✅ Created latest tag"
          fi

          # Docker Hub manifest (如果配置了)
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/nofx-${{ matrix.image_suffix }}"
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${REF_NAME}" \
              "${DOCKERHUB_IMAGE}:${REF_NAME}-amd64" \
              "${DOCKERHUB_IMAGE}:${REF_NAME}-arm64" || true
            echo "✅ Created Docker Hub manifest"
          fi

          echo "🎉 Multi-arch manifest created successfully!"

      - name: Skip manifest reason
        if: |
          (matrix.image_suffix == 'backend' && needs.detect-changes.outputs.build_backend != 'true') ||
          (matrix.image_suffix == 'frontend' && needs.detect-changes.outputs.build_frontend != 'true')
        run: |
          echo "⏭️ Skip manifest for ${{ matrix.image_suffix }} (no relevant changes detected)"
